<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>StackBack WIP prototype</title>
<style>
  :root{
    --p-ink:#303030; --p-muted:#616161; --p-faint:#8a8a8a;
    --p-line:#e3e3e3; --p-line2:#ebebeb;
    --p-primary:#303030; --p-success:#29845a; --p-success-bg:#cdfee1;
    --p-link:#005bd3; --p-attn-bg:#ffefcf; --p-attn:#8a6116;
    --p-crit:#8e1f0b; --p-crit-bg:#fedad1;
    --p-info-bg:#eaf4ff; --p-info:#00527c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#f1f1f1;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--p-ink)}

  /* thin banner so nobody mistakes this for the live app */
  .pbar{background:#1a1a1a;color:#fff;height:40px;display:flex;align-items:center;gap:14px;padding:0 16px;flex-wrap:wrap}
  .pbar b{font-size:13px;font-weight:650}
  .pbar .sub{font-size:12px;color:#b5b5b5}
  .pbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pbar a{color:#fff;font-size:12px;font-weight:600;text-decoration:none;border:1px solid #4a4a4a;border-radius:7px;padding:4px 10px}
  .pbar a:hover{background:#2a2a2a}

  .admin{display:flex;height:calc(100% - 40px)}

  /* Shopify global nav, mock chrome. The real admin draws this around the app iframe. */
  .navL{flex:none;width:236px;background:#ebebeb;border-right:1px solid var(--p-line);padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow:auto}
  .navItem{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:8px;color:#9b9b9b;font-size:13px;font-weight:500;white-space:nowrap}
  .navItem .ico{width:17px;height:17px;flex:none;color:#a8a8a8}
  .navSec{color:var(--p-muted);font-size:13px;font-weight:500;display:flex;align-items:center;height:30px;padding:0 8px;margin-top:6px}
  .navSec .chev{margin-left:auto;color:var(--p-faint)}
  .navApp{display:flex;align-items:center;gap:9px;min-height:32px;padding:5px 8px;border-radius:8px;font-weight:600;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04);margin-top:2px;cursor:pointer;border:0;font-family:inherit;font-size:13px;width:100%;text-align:left}
  .navApp.sel{box-shadow:0 0 0 1px var(--p-primary)}
  .navApp .logo{width:20px;height:20px;border-radius:5px;background:var(--p-primary);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
  .navSub{display:flex;align-items:center;gap:8px;min-height:31px;padding:5px 8px 5px 30px;border-radius:8px;color:var(--p-muted);font-size:13px;cursor:pointer;text-align:left;border:0;background:transparent;font-family:inherit;width:100%}
  .navSub:hover{background:#dedede;color:var(--p-ink)}
  .navSub.sel{color:var(--p-ink);font-weight:600;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .navSub .ico{width:15px;height:15px;flex:none;opacity:.75}
  .navSub .rt{margin-left:auto;display:flex;align-items:center;gap:5px;flex:none}
  .dotx{width:7px;height:7px;border-radius:50%;flex:none}
  .dotx.ok{background:var(--p-success)}.dotx.warn{background:#c8952a}
  .dotx.part{background:#4a89c0}.dotx.off{background:#b5b5b5}
  .navFold{font-size:12px;color:var(--p-muted);padding:6px 8px 2px 30px}
  .navGap{flex:1;min-height:10px}

  .appmain{flex:1;min-width:0;display:flex;flex-direction:column;background:#f1f1f1}
  .appbar{height:52px;background:#fff;border-bottom:1px solid var(--p-line);display:flex;align-items:center;gap:10px;padding:0 18px;flex:none}
  .appbar .logo{width:24px;height:24px;border-radius:6px;background:var(--p-primary);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
  .appbar .name{font-weight:650;font-size:14px}
  .bell{margin-left:auto;position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#4a4a4a;background:#f6f6f6;border:1px solid var(--p-line);cursor:pointer}
  .bell.sel{box-shadow:0 0 0 1px var(--p-primary)}
  .bell .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--p-crit);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}

  /* screen switcher, only shown when a module holds more than one locked screen */
  .subbar{background:#fff;border-bottom:1px solid var(--p-line);padding:9px 18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:none}
  .subbar .lbl{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--p-faint);margin-right:3px}
  .subbar button{appearance:none;height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--p-line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:var(--p-muted);cursor:pointer}
  .subbar button.on{background:var(--p-primary);color:#fff;border-color:var(--p-primary)}

  .stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .stage iframe{width:100%;flex:1;min-height:0;border:0;display:block;background:#f1f1f1}
  .sfCap{flex:none;background:var(--p-attn-bg);border-bottom:1px solid #f0d9a8;color:var(--p-attn);font-size:12px;padding:9px 16px}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--p-faint);font-size:13px;background:#f1f1f1}
  .loading.hide{display:none}

  /* placeholder for modules with no designed screen yet */
  .ph{padding:26px 24px;overflow:auto;height:100%}
  .phHead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .phTitle{font-size:20px;font-weight:650;letter-spacing:-.2px;margin:0}
  .phSub{color:var(--p-muted);margin:4px 0 0;font-size:13px;max-width:70ch}
  .chip{font-size:11px;font-weight:650;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .chip.ok{background:var(--p-success-bg);color:var(--p-success)}
  .chip.warn{background:var(--p-attn-bg);color:var(--p-attn)}
  .chip.info{background:var(--p-info-bg);color:var(--p-info)}
  .chip.neu{background:#f1f1f1;color:var(--p-muted)}
  .chip.crit{background:var(--p-crit-bg);color:var(--p-crit)}
  .phCard{background:#fff;border:1px solid var(--p-line);border-radius:12px;margin-top:16px;overflow:hidden;max-width:900px}
  .phCard .hd{padding:12px 14px;border-bottom:1px solid var(--p-line2);font-weight:650;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .phCard .hd .hint{margin-left:auto;font-weight:500;font-size:12px;color:var(--p-faint)}
  .phRow{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--p-line2);font-size:12.5px}
  .phRow:last-child{border-bottom:0}
  .phRow .g{flex:1;min-width:0}
  .phNote{background:var(--p-info-bg);border:1px solid #b9dcf5;color:var(--p-info);border-radius:10px;padding:12px 14px;margin-top:16px;font-size:12.5px;max-width:900px}
  .phNote b{font-weight:650}
  code.rte{font:600 11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f6f6f6;border:1px solid var(--p-line2);border-radius:5px;padding:1px 5px;color:#444}

  @media (max-width:900px){
    .admin{flex-direction:column;height:auto}
    .navL{width:100%;overflow:visible}
    .stage{height:80vh}
  }
</style>
</head>
<body>

<div class="pbar">
  <b>StackBack WIP prototype</b>
  <span class="sub">Latest approved state only. Superseded and pending-review work lives in the tracker, not here.</span>
  <span class="right">
    <a href="IA_MerchantAdmin_v3.html">Module tracker &#8599;</a>
  </span>
</div>

<div class="admin">
  <aside class="navL" id="navL"></aside>
  <div class="appmain">
    <div class="appbar">
      <div class="logo">SB</div>
      <div class="name">StackBack Subscriptions</div>
      <button class="bell" id="bellBtn" title="Admin alerts">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge">3</span>
      </button>
    </div>
    <div class="subbar" id="subbar" style="display:none"></div>
    <div class="stage" id="stage">
      <div class="loading hide" id="loading">Loading screen&hellip;</div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   EDIT HERE. One list. Add a screen to a module and it becomes
   navigable in this prototype immediately.

   screens: [] means nothing is designed yet, so the module shows a
   placeholder built from status + next + backlog below.
   Paths are relative to this file (Design/Wireframes/).
   ================================================================ */

var ICO = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/>',
  plans:'<path d="M4 5h16M4 12h16M4 19h10"/>',
  subs:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10h8M8 14h5"/>',
  orders:'<path d="M3 6h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8Z"/><path d="M9 10v6M15 10v6"/>',
  pay:'<rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19"/>',
  inv:'<path d="M3 20V9l9-5 9 5v11"/><path d="M8 20v-6h8v6"/>',
  cust:'<circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/>',
  widget:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/>',
  portal:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17"/>',
  land:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17M7.5 13h6"/>',
  notif:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 20v-6M13 20v-9M18 20v-4"/>',
  gear:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1"/>'
};
var svg = function(k){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICO[k]||'')+'</svg>'; };

/* kind: 'admin' (default) or 'storefront'. Storefront screens carry StackBack brand tokens
   and have no admin chrome, so they are captioned rather than passed off as admin screens.
   The two-palette rule is decided by what is being shown, not which shell it sits in. */
var S = function(label,path,note,kind){ return {label:label,path:path,note:note||'',kind:kind||'admin'}; };

/* ============================================================================
   MAINTENANCE CONTRACT for this file. Read before editing MODULES.

   This prototype is the GO-TO for checking latest progress, so it answers one
   question only: what does StackBack look like right now, as approved?

   RULE 1  One entry per DISTINCT screen, carrying its latest approved version only.
           A module may hold several distinct screens: Plans has the listing, create
           plan and create bundle. It must never hold two versions of the same screen.
   RULE 2  Superseded versions never appear here. Neither does work pending review.
           Both belong in IA_MerchantAdmin_v3.html, which is the full record and
           deliberately keeps everything, version history included.
   RULE 3  The moment a screen is approved or a new version replaces an approved one,
           update this file in the same session. REPLACE that screen's entry, do not
           append to it. Then note what changed in the module's `next` and `todo`.
   RULE 4  A module with nothing approved carries screens:[] and explains itself
           through `todo`. An empty module is honest; a stale one is not.

   If a screen is here, it is approved. That guarantee is the whole value of the file.
   ============================================================================ */
var MODULES = [
 { id:'home', label:'Home', icon:'home', slot:false, status:'wip',
   sub:'Onboarding for a new store, a working dashboard after that. No nav slot: the app-name row above is the Home link.',
   next:'Decide whether the onboarding revamp stays parked. Both prototypes are approved.',
   screens:[],
   todo:['Onboarding revamp is spec-and-prototype complete but parked','Post-onboarding dashboard prototype locked, not built','Churn or retention KPI on the glance layer is undecided','Three prototype nits open: minute-based defaults, crushed status cards, dead code'] },

 { id:'plans', label:'Plans', icon:'plans', slot:true, status:'wip',
   sub:'Everything you sell through StackBack. One plan can generate many subscriptions.',
   next:'Two dev confirmations gate the build: flat per-plan shipping override, and the bundle listing loader returning products.',
   screens:[
     S('Purchase options listing','/merchant/PurchaseOptions_Listing_v12.html','v12, locked 2026-07-21. The list the create screens sit under.'),
     S('Create subscription plan','/merchant/Polaris/PlanSetup_Polaris_v2.html','Approved 2026-07-24, real Polaris web components.'),
     S('Create bundle','/merchant/Polaris/BundleSetup_Polaris_v2.html','Approved in principle 2026-07-24. Five formats, Fixed box first.')
   ],
   todo:[] },

 { id:'subs', label:'Subscriptions', icon:'subs', slot:true, status:'ship',
   sub:'The agreements customers hold. Each carries a contract code and generates orders over time.',
   next:'Rename the module and retire the two order aliases. No new screen work.',
   screens:[],
   todo:['Shipped and in use, but never redesigned','Two alias routes still redirect here and block the rename','The two contract-detail routes are named for orders, which is the exact confusion the naming rule exists to prevent'] },

 { id:'orders', label:'Orders', icon:'orders', slot:true, status:'wip',
   sub:'Every paid order, placed and still to be placed. Operations owns this screen.',
   next:'Locked at v5. Four dev confirmations open, the biggest being whether Shopify returns a usable push-failure code.',
   screens:[
     S('Orders','/merchant/Polaris/Orders_Polaris_v5.html','v5, approved 2026-08-04. Three states: To be placed, Push failed, Order placed, and deliberately no Delivered. Identity follows the lifecycle. Product-preview capsules with a Details popup. Accepts a #sku= filter from Inventory.')
   ],
   todo:['DEV: does Shopify return a usable error code when a push fails? The whole reason column was removed on the assumption it does not','DEV: is the pre-push to-be-placed state queryable?','DEV: is delivery sequence real data, and what does it mean after a reschedule or skip?','Nobody tells the CUSTOMER their delivery slipped','The add or swap price difference is undecided, and it blocks building that popup'] },

 { id:'pay', label:'Payment Reminders', icon:'pay', slot:true, status:'wip',
   sub:'Customer Success work queue. Money owed first, paused subscriptions second.',
   next:'Locked at v2, but STILL OWES the Polaris component rebuild. Dev to confirm a stored paused-reason.',
   screens:[
     S('Payment Reminders','/merchant/Polaris/PaymentReminders_Polaris_v6.html','v6, 2026-08-05. Corrects the dunning model: the merchant sets the reminder count and a pause rule of N days before delivery, so nothing on the Ongoing tab is OVERDUE. It is due with a deadline, and the column counts DOWN to the pause. Overdue exists only on the Paused tab. One row button, Contact customer, with sending moved into the popup beside the email address it uses. PAYG continuation leads the tiles.')
   ],
   todo:['DEV: is the paused REASON stored, or only inferred?','A customer-paused contract whose resume date has PASSED still has nowhere to surface. v5 flags the no-date case as Open ended; the passed-date case needs a real date comparison','Confirm Contact customer is genuinely staffed: it assumes reachable contact details and somebody at the merchant to use them','ACCEPTED GAP: no way to tell whether the contacting is worth the staffing. Deferred to post-pilot on purpose'] },

 { id:'inv', label:'Inventory', icon:'inv', slot:true, status:'wip',
   sub:'Forward demand from contracts StackBack already holds. Operations owns it. Read-only, dashboard first.',
   next:'Locked at v4. Highest-value gap is freebies and Nth-order gifts, which the forecast does not count at all.',
   screens:[
     S('Inventory','/merchant/Polaris/Inventory_Polaris_v4.html','v4, approved 2026-08-04. Two tabs, Summary and By product. Demand-only, split Paid / Not paid yet. Exactly two row actions, both links out: Paid opens Orders, Not paid yet opens Payment Reminders.')
   ],
   todo:['Freebies and Nth-order gifts are absent from the forecast, so a gift SKU the warehouse must pick is invisible','Are skips and pauses netted out? If not the forecast overstates demand','CORRECTED 2026-08-04: StackBack CAN read stock. read_inventory is granted and inventoryQuantity is read in production. Demand-only was chosen anyway on feasibility grounds, accepting that a shortfall on a continue-selling store stays invisible'] },

 { id:'cust', label:'Customers', icon:'cust', slot:true, status:'ship',
   sub:'Everyone with StackBack activity, subscribers and one-time buyers.',
   next:'Nothing. This module is complete for this cycle.',
   screens:[],
   todo:['Shipped and complete. Listing plus detail, with a no-subscriptions tab that already covers one-time buyers.'] },

 { id:'widget', label:'Widget', icon:'widget', slot:true, status:'wip',
   sub:'The purchase option card on your product pages.',
   next:'Lock the Arusha liner copy, and decide v2, v3 and v4.',
   screens:[],
   todo:['Widget v1 is the locked version but exists only as JSX, so it cannot render here','v2 form, v3 quiz and v4 popover are built and awaiting an internal decision. Not approved, so they are not loaded here. All three are in the module tracker','The shipped widget template editor has no designed admin screen at all'] },

 { id:'portal', label:'Portal', icon:'portal', slot:true, status:'wip',
   sub:'Where customers manage their own subscriptions.',
   next:'Run the data audit on brand fields duplicated between Settings and Portal Settings.',
   screens:[],
   todo:['Shipped, never redesigned','The preview route is a placeholder stub in production','PAYG Pay Now button is unwired even though the invoice route works','Brand fields are duplicated and it is unknown which source is authoritative'] },

 { id:'land', label:'Landing Pages', icon:'land', slot:true, status:'ship',
   sub:'Standalone pages per product, bundle or flash sale.',
   next:'Retire the alias route. No design work outstanding.',
   screens:[],
   todo:['The most complete module here. Five shipped routes, one alias to remove, nothing designed-but-unbuilt.'] },

 { id:'chart', label:'Analytics', icon:'chart', slot:true, status:'open',
   sub:'Revenue, retention and churn across subscriptions and bundles.',
   next:'Reconcile the INT05 spec against the shipped prototype before building either.',
   screens:[],
   todo:['No route exists. The whole module is a proposal','Spec section 13.4 describes six cards; the prototype shipped three metrics','Metric definitions are grill-locked on a cash-collected basis','Whether PAYG blocks auto-suppress for prepaid-only merchants is open'] },

 { id:'gear', label:'Settings', icon:'gear', slot:true, status:'wip',
   sub:'Everything configured once and revisited rarely. Grouped, and searchable.',
   next:'Build the grouped rail and search. A flat list this long recreates the problem the refactor exists to solve.',
   screens:[],
   todo:['Nine groups plus search is designed but not built','Branding, Customer notifications, Admin alert delivery and Integrations all move in','Checkout compatibility now sits two levels deep, which is where Ops needs it under pressure','The shipped Jobs dashboard has no confirmed home'] },

 { id:'bill', label:'Billing', icon:'pay', slot:true, status:'ship',
   sub:'Your StackBack plan, usage against it, and overage. Pulled out of Settings on 2026-07-28.',
   next:'Positional change only. The shipped screen needs no edit.',
   screens:[],
   todo:['Shipped. The only change is that it leaves Settings and sits directly below it in the nav.'] },

 { id:'notif', label:'Notifications', icon:'notif', slot:false, status:'wip',
   sub:'Two systems in one word. Merchant alerts in the bell, customer messages inside Settings. No nav slot.',
   next:'Confirm the bell against App Bridge, then draft the ten template contents.',
   screens:[],
   todo:['Admin notification route is shipped backend with no designed screen','Ten canonical templates locked, content phase not started','BUG-001: Delivery Updated does not fire on customer edits','Bell versus no-bell is the one genuinely open structural call in the IA'] }
];

var ST = {
  ship:{d:'ok',   c:'ok',   t:'Shipped'},
  wip: {d:'warn', c:'warn', t:'WIP'},
  part:{d:'part', c:'info', t:'Partial'},
  open:{d:'off',  c:'neu',  t:'Not started'}
};

var NAV_ORDER = ['plans','subs','orders','pay','inv','cust','widget','portal','land','chart','gear','bill'];
var FOLD_AFTER = 9;

var byId = function(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; };
var $ = function(id){ return document.getElementById(id); };

var sel='orders', screenIx=0;

function shopifyChrome(){
  var items=[['Home','home'],['Orders','orders'],['Products','plans'],['Customers','cust'],
             ['Marketing','chart'],['Discounts','pay'],['Content','land'],['Analytics','chart']];
  return items.map(function(p){ return '<div class="navItem">'+svg(p[1])+p[0]+'</div>'; }).join('')
    + '<div class="navSec">Sales channels <span class="chev">&#8250;</span></div>'
    + '<div class="navSec">Apps <span class="chev">&#8250;</span></div>';
}

function renderNav(){
  var home=byId('home');
  var out = shopifyChrome();
  out += '<button class="navApp'+(sel==='home'?' sel':'')+'" data-id="home"><span class="logo">SB</span>StackBack Subs'
       + '<span class="rt"><span class="dotx '+ST[home.status].d+'"></span></span></button>';
  out += NAV_ORDER.map(function(id,ix){
    var m=byId(id), n=m.screens.length;
    var s = '<button class="navSub'+(id===sel?' sel':'')+'" data-id="'+id+'" title="'
          + (n? n+' locked screen'+(n===1?'':'s') : 'no designed screen yet')+'">'
          + svg(m.icon)+m.label
          + '<span class="rt">'+(n?'<span class="chip ok" style="font-size:10px;padding:1px 5px">'+n+'</span>':'')
          + '<span class="dotx '+ST[m.status].d+'"></span></span></button>';
    if(ix===FOLD_AFTER-1) s += '<div class="navFold">View more</div>';
    return s;
  }).join('');
  out += '<div class="navGap"></div>';
  out += '<div class="navItem">'+svg('gear')+'Settings</div>';
  $('navL').innerHTML = out;

  var nodes=$('navL').querySelectorAll('[data-id]');
  for(var i=0;i<nodes.length;i++){
    nodes[i].onclick = (function(el){ return function(){ go(el.getAttribute('data-id'),0); }; })(nodes[i]);
  }
  $('bellBtn').className = 'bell'+(sel==='notif'?' sel':'');
}

function renderSubbar(m){
  if(m.screens.length<2){ $('subbar').style.display='none'; $('subbar').innerHTML=''; return; }
  $('subbar').style.display='flex';
  $('subbar').innerHTML = '<span class="lbl">Screen</span>' + m.screens.map(function(s,i){
    return '<button data-ix="'+i+'"'+(i===screenIx?' class="on"':'')+'>'+s.label+'</button>';
  }).join('');
  var b=$('subbar').querySelectorAll('[data-ix]');
  for(var i=0;i<b.length;i++){
    b[i].onclick = (function(el){ return function(){ go(sel, parseInt(el.getAttribute('data-ix'),10)); }; })(b[i]);
  }
}

function placeholder(m){
  var st=ST[m.status];
  return '<div class="ph">'
    + '<div class="phHead"><div><h1 class="phTitle">'+m.label+'</h1><p class="phSub">'+m.sub+'</p></div>'
    + '<div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">'
    + '<span class="chip '+st.c+'">'+st.t+'</span>'
    + (m.slot?'':'<span class="chip neu">No nav slot</span>')
    + '<span class="chip neu">No screen designed</span></div></div>'
    + '<div class="phCard"><div class="hd">Where this module stands <span class="hint">'+m.todo.length+' point'+(m.todo.length===1?'':'s')+'</span></div>'
    + m.todo.map(function(t){ return '<div class="phRow"><span class="dotx '+st.d+'" style="margin-top:5px"></span><div class="g">'+t+'</div></div>'; }).join('')
    + '</div>'
    + '<div class="phCard"><div class="hd">Next action</div><div class="phRow"><div class="g">'+m.next+'</div></div></div>'
    + '<div class="phNote"><b>Nothing to click here yet.</b> This module has no APPROVED screen, so the prototype shows its position instead of a mock. Work in progress or awaiting review does not appear here by design. The moment a screen is approved, replace this module\'s <code class="rte">screens</code> entry in the <code class="rte">MODULES</code> list in this file, with exactly one entry pointing at the new canonical version. Full version history, route detail and backlog live in the <a href="IA_MerchantAdmin_v3.html" style="color:inherit;font-weight:650">module tracker</a>.</div>'
    + '</div>';
}

function go(id, ix){
  sel=id; screenIx=ix||0;
  var m=byId(id);
  renderNav(); renderSubbar(m);

  var stage=$('stage');
  if(!m.screens.length){
    stage.innerHTML = placeholder(m);
    return;
  }
  var s=m.screens[screenIx];
  /* Tell the screen to hide its own sidebar and app bar so this shell is the only one.
     A HASH is used, not a query string: some static servers (serve's clean-URL rewrite
     among them) redirect away the .html extension and drop the query with it, so ?bare=1
     silently never arrives. The hash survives that redirect. */
  var src = s.path + '#bare';
  var cap = s.kind==='storefront'
    ? '<div class="sfCap">Storefront surface, not an admin screen. It carries StackBack brand tokens (cream, amber, purple) rather than the Polaris-neutral admin palette, because the palette follows what is being shown.</div>'
    : '';
  stage.innerHTML = cap
                  + '<div class="loading" id="loading">Loading '+s.label+'&hellip;</div>'
                  + '<iframe id="fr" title="'+s.label+'"></iframe>';
  var fr=$('fr');
  fr.onload = function(){
    var l=$('loading'); if(l) l.className='loading hide';
    /* Belt and braces: inject the same rule directly. Same-origin, so this works even if
       the screen predates the bare-mode snippet or the hash gets stripped too. */
    try{
      var d=fr.contentDocument;
      d.documentElement.classList.add('bare');
      if(!d.getElementById('bareInject')){
        var st=d.createElement('style');
        st.id='bareInject';
        st.textContent='.navL,.appbar,.savebar{display:none!important}.admin{min-height:0}html,body{background:#f1f1f1}';
        d.head.appendChild(st);
      }
    }catch(e){ /* cross-origin, nothing to do */ }
  };
  fr.src = src;
}

$('bellBtn').onclick = function(){ go('notif',0); };

/* deep link: ?m=orders opens straight into a module */
var qm = (location.search.match(/[?&]m=([a-z]+)/)||[])[1];
go(byId(qm)?qm:'orders', 0);
</script>
